# Produktion auf dem eigenen VPS: Worker hinter Caddy (automatisches TLS).
# Start: cp .env.example .env && docker compose up -d --build
services:
  cv-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 2g
    read_only: true
    tmpfs:
      - /tmp:size=2g
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - cv-worker

volumes:
  caddy_data:
  caddy_config:
