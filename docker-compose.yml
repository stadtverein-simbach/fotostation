# Lokale Entwicklung mit Laravel Sail (PHP 8.5), inkl. cv-worker.
#
# Einmalig:  cp .env.sail.example .env
#            127.0.0.1 rustfs  in /etc/hosts eintragen (siehe README)
# Start:     ./vendor/bin/sail up -d
#
# Dienste: App (http://localhost), Queue-Worker, Scheduler, PostgreSQL,
# RustFS (S3, beide Buckets), cv-worker, Mailpit (http://localhost:8025).
# For more information: https://laravel.com/docs/sail

x-sail-app: &sail-app
    build:
        context: ./vendor/laravel/sail/runtimes/8.5
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP}'
    image: sail-8.5/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
        - '.:/var/www/html'
    networks:
        - sail

services:
    laravel.test:
        <<: *sail-app
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        depends_on:
            pgsql:
                condition: service_healthy
            s3-setup:
                condition: service_completed_successfully
            cv-worker:
                condition: service_started
            mailpit:
                condition: service_started

    # Verarbeitungskette (PrepareImage/MatchReference/AlignImage/DetectFaces/...).
    # queue:listen lädt Codeänderungen bei jedem Job neu, ein Neustart ist nicht nötig.
    queue:
        <<: *sail-app
        command: >
            php artisan queue:listen
            --queue=${FOTOSTATION_QUEUE:-uploads}
            --timeout=90
            --tries=3
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy
            s3-setup:
                condition: service_completed_successfully
            cv-worker:
                condition: service_started

    # Nächtliche Aufgaben (Zeitraffer, Löschfristen) um FOTOSTATION_NIGHTLY_AT.
    # Sofort von Hand: sail artisan fotostation:render-changed
    scheduler:
        <<: *sail-app
        command: php artisan schedule:work
        restart: unless-stopped
        depends_on:
            pgsql:
                condition: service_healthy

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            # Kein "testing"-Datenbank-Skript aus vendor/: phpunit.xml nutzt SQLite im Speicher.
            - 'sail-pgsql:/var/lib/postgresql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            retries: 3
            timeout: 5s

    # S3-kompatibler Speicher für photos-private und photos-public.
    # RustFS statt MinIO: MinIO veröffentlicht keine Community-Images mehr
    # auf Docker Hub (minio/minio, minio/mc lassen sich nicht mehr ziehen).
    #
    # Der Hostname "rustfs" muss auch auf deinem Rechner auflösen
    # ("127.0.0.1 rustfs" in /etc/hosts), weil vorsignierte URLs an den
    # Hostnamen gebunden sind: Browser, Laravel und cv-worker nutzen so
    # dieselbe URL. Konsole: http://localhost:9001
    rustfs:
        image: 'rustfs/rustfs:latest'
        ports:
            - '${FORWARD_RUSTFS_PORT:-9000}:9000'
            - '${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001'
        environment:
            RUSTFS_VOLUMES: '/data'
            RUSTFS_ADDRESS: '0.0.0.0:9000'
            RUSTFS_CONSOLE_ADDRESS: '0.0.0.0:9001'
            RUSTFS_CONSOLE_ENABLE: 'true'
            RUSTFS_ACCESS_KEY: '${PHOTOS_KEY:-fotostation}'
            RUSTFS_SECRET_KEY: '${PHOTOS_SECRET:-fotostation-secret}'
            RUSTFS_LOG_LEVEL: 'info'
            # Filament (FilePond) lädt vorhandene Dateien per fetch() aus dem Bucket
            # und braucht dafür CORS. Erlaubt ist nur die eigene App-Adresse.
            RUSTFS_CORS_ALLOWED_ORIGINS: '${APP_URL:-http://localhost}'
        volumes:
            - 'sail-rustfs:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'sh', '-c', 'curl -f http://127.0.0.1:9000/health']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    # Legt die beiden Buckets an (idempotent); photos-public ist öffentlich lesbar.
    s3-setup:
        image: 'amazon/aws-cli:latest'
        depends_on:
            rustfs:
                condition: service_healthy
        environment:
            AWS_ACCESS_KEY_ID: '${PHOTOS_KEY:-fotostation}'
            AWS_SECRET_ACCESS_KEY: '${PHOTOS_SECRET:-fotostation-secret}'
            AWS_DEFAULT_REGION: 'us-east-1'
            PRIVATE_BUCKET: '${PHOTOS_PRIVATE_BUCKET:-photos-private}'
            PUBLIC_BUCKET: '${PHOTOS_PUBLIC_BUCKET:-photos-public}'
        entrypoint: ['/bin/sh', '-ec']
        command:
            - |
              s3() { aws --endpoint-url http://rustfs:9000 "$$@"; }
              for b in "$$PRIVATE_BUCKET" "$$PUBLIC_BUCKET"; do
                s3 s3api head-bucket --bucket "$$b" 2>/dev/null || s3 s3 mb "s3://$$b"
              done
              s3 s3api put-bucket-policy --bucket "$$PUBLIC_BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$$PUBLIC_BUCKET/*\"]}]}"
              echo "Buckets bereit: $$PRIVATE_BUCKET, $$PUBLIC_BUCKET (öffentlich lesbar)"
        networks:
            - sail

    # Bildverarbeitung (FastAPI, OpenCV, ffmpeg). Beim ersten Build wird das
    # YuNet-Modell für die Gesichtserkennung heruntergeladen.
    cv-worker:
        build: ./cv-worker
        environment:
            WORKER_TOKEN: '${CV_WORKER_TOKEN:-dev-token}'
            # Nur aus dem lokalen RustFS laden
            ALLOWED_URL_PREFIXES: '${PHOTOS_ENDPOINT:-http://rustfs:9000}/'
            LOG_LEVEL: '${CV_WORKER_LOG_LEVEL:-INFO}'
        ports:
            - '${FORWARD_CV_WORKER_PORT:-8001}:8000'
        tmpfs:
            - '/tmp:size=2g'
        networks:
            - sail
        depends_on:
            - rustfs

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-rustfs:
        driver: local
